.tag{display:inline-block;background:var(--sage2);border-radius:99px;padding:2px 10px;font-size:13px;margin:2px 4px 2px 0}.tag.l{background:var(--lav2)}

.set{display:flex;gap:8px;align-items:center;margin:8px 0}.set input{width:100%;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:0 10px;text-align:center}

textarea{width:100%;min-height:64px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:10px}
select,input[type=date],input[type=number]{min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:0 8px}
.safe{font-size:13px;color:var(--mut);background:var(--lav2);border-radius:14px;padding:10px 12px;margin:10px 0}
.guide h3{font-size:16px;margin:16px 0 4px;font-family:inherit}.guide ol,.guide ul{padding-left:22px;margin:4px 0}.guide li{margin:8px 0}
svg.fig{width:100%;max-height:150px;background:var(--sage2);border-radius:16px}
.bar{height:10px;background:var(--sage2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--sage)}
.day{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.day.v{background:var(--lav2);border-radius:12px;padding:10px}
.cel{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(0,0,0,.4)}.cel>div{background:var(--card);border-radius:24px;padding:28px;text-align:center;max-width:320px;animation:pop .5s}
.cel b{display:inline-block;font-size:44px;animation:pop .6s}

@media(prefers-reduced-motion:reduce){*{animation:none!important}}

<script>
const $=s=>document.querySelector(s),K='steady12';
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>{const[a,b,c]=s.split('-');return new Date(+a,+b-1,+c)};
const add=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const mon=s=>{const d=pd(s);return add(s,-((d.getDay()+6)%7))};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TODAY=ymd(new Date());
const TRIPS=[{s:'2026-11-26',e:'2026-12-02',n:'Thanksgiving'},{s:'2026-12-23',e:'2026-12-27',n:'Christmas'}];
let S={};
try{S=JSON.parse(localStorage.getItem(K))||{}}catch(e){}
S=Object.assign({start:TODAY,phase:1,done:{},sched:{},logs:[],vac:[],vacOn:false,prot:{on:true,t:100},nut:{},well:{},refl:{},meas:false,m:[],seen:false,add:{},wo:0,flags:{}},S);
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
let tab='home',P=null;

const MSG=["A 10-minute workout still counts.","If you miss a day, just do the next workout on your list.","Lighter weight with good form is still progress.","Any exercise can be swapped for an easier version.","Rest days are part of the plan.","Strength builds slowly. Doing it regularly is what matters."];
const msg=()=>MSG[Math.floor(pd(TODAY).getTime()/864e5)%MSG.length];

/* ---------- vacation ---------- */
const trips=()=>TRIPS.concat(S.vac);
const isVac=d=>S.vacOn&&d===TODAY||trips().some(t=>d>=t.s&&d<=t.e);
const VMSG="Workouts aren't scheduled while you're away, and nothing is marked missed. Pick the plan back up when you're home.";

/* ---------- content ---------- */
const fig=p=>{const c='stroke="#6f8f75" stroke-width="5" stroke-linecap="round" fill="none"',a='stroke="#8e7fbf"';
const B={lie:`<circle cx="20" cy="56" r="7" fill="#6f8f75"/><path ${c} d="M28 60H70L88 42L104 60"/><path ${a} stroke-width="5" stroke-linecap="round" d="M30 60L48 66"/>`,
sit:`<circle cx="44" cy="18" r="7" fill="#6f8f75"/><path ${c} d="M44 26V54H80V76"/><path ${a} stroke-width="5" stroke-linecap="round" fill="none" d="M44 34L66 42"/><rect x="26" y="26" width="6" height="40" rx="3" fill="#8e7fbf" opacity=".4"/>`,
stand:`<circle cx="60" cy="14" r="7" fill="#6f8f75"/><path ${c} d="M60 22V50L48 76M60 50L72 76"/><path ${a} stroke-width="5" stroke-linecap="round" fill="none" d="M60 30L48 46M60 30L72 46"/>`,
all4:`<circle cx="28" cy="32" r="7" fill="#6f8f75"/><path ${c} d="M36 36H82L86 64M40 36V64"/><path ${a} stroke-width="5" stroke-linecap="round" fill="none" stroke-dasharray="2 8" d="M82 36L108 36M36 36L12 36"/>`,
wall:`<rect x="100" y="6" width="8" height="70" rx="4" fill="#8e7fbf" opacity=".4"/><circle cx="52" cy="18" r="7" fill="#6f8f75"/><path ${c} d="M56 26L72 52L66 76M72 52L82 76"/><path ${a} stroke-width="5" stroke-linecap="round" fill="none" d="M60 32L98 36"/>`};
return`<svg class="fig" viewBox="0 0 120 84" role="img" aria-label="Simple diagram of the exercise position">${B[p]}</svg>`};

const EX={
abd:{n:"Seated hip abduction",p:'sit',m:"Outer glutes (gluteus medius), hips",s:"2 × 10",eq:"Hip abduction machine",e:["Lighter weight, smaller range","Lower the weight and move through a smaller range. Pause at the start of each rep."],h:["Side-lying hip abduction","Lie on your side, knees slightly bent. Lift the top leg a little up and back, then lower slowly."],how:"Sit tall with your back against the pad. Set the pads on the outside of your knees. Press knees outward with control, pause briefly, then return slowly.",mi:"Swinging or using momentum. Leaning forward. Letting the weight slam back.",sf:"Stop if you feel a pinch in the hip or low back."},
lp:{n:"Leg press",p:'sit',m:"Glutes, quads, hamstrings",s:"2 × 8",eq:"Leg press machine",e:["Chair sit-to-stand","Sit on a sturdy chair, stand up, then sit back down slowly. Use your hands if helpful.","ss"],h:["Chair sit-to-stand","Stand up from a chair and sit back down slowly. Push through your whole foot."],how:"Set the seat so your knees are bent comfortably. Feet hip-width apart, mid-platform. Press through your heels, stop just short of locking your knees, then return slowly.",mi:"Locking knees. Lifting hips off the seat. Going deeper than feels comfortable for your back.",sf:"Keep your lower back against the pad. Start light. Stop if your back or knees hurt."},
gb:{n:"Glute bridge",p:'lie',m:"Glutes (maximus), hamstrings, core",s:"2 × 8–10",eq:"None (mat)",e:["Short-range bridge","Lift hips only a few inches. Same squeeze, smaller movement."],h:["Glute bridge","Same exercise at home on a mat or bed edge."],how:"Lie on your back, knees bent, feet flat. Press through your heels and lift your hips until your body forms a comfortable line. Squeeze your glutes, pause, lower slowly.",mi:"Arching the low back. Pushing through toes. Lifting too high.",sf:"If your back pinches, lift lower. Stop for sharp pain."},

row:{n:"Seated cable row",p:'sit',m:"Upper back, shoulders, posture muscles",s:"2 × 10",eq:"Seated cable row machine",e:["Lighter weight, shorter pull","Use a light weight and pull only halfway."],h:["Resistance-band row","Sit with a band around your feet. Pull elbows back and squeeze shoulder blades."],how:"Sit tall, chest up. Pull the handle toward your lower ribs, squeeze your shoulder blades together, then return slowly.",mi:"Leaning back to pull. Shrugging shoulders.",sf:"Keep your back long. Stop for sharp back or shoulder pain."},

const DET={
abd:{n:["Hip abduction machine (the seated one where you push two pads outward with your knees). It's usually near the leg press or other lower-body machines. A staff member can point it out.","No equipment. A mat, rug or bed works. Optional: a loop resistance band."],
st:["Sit all the way back in the seat with your back flat against the pad and feet on the footrests.","Set the starting-width lever so your knees begin fairly close together without feeling stretched. If you can't find it, ask staff to set it for you.","Place the pads on the outsides of your knees. Pick a light weight with the pin near the top of the stack.","Breathe out and push your knees apart for about 2 seconds, to a comfortable width.","Pause for 1 second.","Breathe in and bring your knees back slowly over 3 seconds. Don't let the weights drop or clank."],
hs:["Lie on your right side on a mat, legs stacked. Bend the bottom knee a little for balance and rest your head on your arm.","Keep the top leg straight with toes pointing forward, not up at the ceiling. Keep your hips stacked and don't roll backward.","Lift the top leg to about hip height (roughly a 45 degree angle), over 2 seconds.","Pause for 1 second, then lower slowly over 3 seconds.","Do all your reps, then switch sides."],

const guide=(id,home)=>{const d=DET[id],x=EX[id],h=home&&d.hs;return`<div class="guide"><h3>What you need</h3><p><b>At the gym:</b> ${d.n[0]}</p><p><b>At home:</b> ${d.n[1]}</p><h3>How to do it${h?' (home version)':''}</h3><ol>${(h?d.hs:d.st).map(t=>`<li>${t}</li>`).join('')}</ol><h3>What it should feel like</h3><p>${d.f}</p><h3>Common mistakes</h3><ul>${d.mi.map(t=>`<li>${t}</li>`).join('')}</ul><h3>Stop if</h3><p>${x.sf}</p></div>`};
const W={A:{n:"Glutes & lower body",t:"20–30 min",ex:['abd','lp','gb','hc']},B:{n:"Cardio",t:"15–25 min",c:1},C:{n:"Upper body & core",t:"20–30 min",ex:['row','cp','bd','wp']},D:{n:"Cardio / walking",t:"15–25 min",c:1},E:{n:"Glutes & full body",t:"20–30 min",ex:['abd','ss','row','gb']}};
const PH=[["Phase 1 · Build confidence","Get comfortable. 1–2 sets, light weight. Finish feeling you could do a bit more. Easy cardio only."],["Phase 2 · Build strength","Work toward 2 sets. Add weight only when form feels comfortable. Cardio time grows slowly."],["Phase 3 · Build independence","Add new exercises if you like. Build a routine you can keep after 12 weeks."]];
const FOODS={Breakfast:["Eggs and toast","Greek yogurt, fruit, granola","Oatmeal with milk and nut butter"],Lunch:["Chicken or tofu rice bowl","Turkey sandwich","Bean and rice bowl"],Dinner:["Salmon, potatoes, vegetables","Chicken pasta","Stir-fry with rice","Tacos with beans or meat"],Snacks:["Greek yogurt","Cottage cheese and fruit","Hummus and vegetables","Cheese and crackers","Peanut butter toast"]};
const SAFE=`<div class="safe"><b>Asthma:</b> follow your asthma action plan and use your prescribed medication as directed. Ask your clinician about exercise symptoms. Don't push through wheezing, chest tightness, or unusual breathlessness. Stop and follow your plan. If symptoms are severe or don't improve, get urgent medical help.</div>`;

/* ---------- helpers ---------- */
const wk=()=>Math.max(1,Math.min(12,Math.floor((pd(TODAY)-pd(S.start))/6048e5)+1));
function weekDone(w){const s={};for(let i=0;i<7;i++){const d=S.done[add(w,i)];if(d)Object.keys(d).forEach(k=>s[k]=d[k])}return s}
function suggest(){const sc=(S.sched[TODAY]||[]).find(k=>!(S.done[TODAY]||{})[k]);if(sc)return sc;const d=weekDone(mon(TODAY));return Object.keys(W).find(k=>!d[k])||null}
const exList=(slot,lvl)=>{const l=W[slot].ex.concat((S.add[slot]||[]));return lvl==='min'?l.slice(0,2):l};
const cardioTarget=()=>[12,18,22][S.phase-1];

/* ---------- main render ---------- */
function render(){
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 $('#m').innerHTML=({home,workouts,nutrition,progress,plan})[tab]();scrollTo(0,0)}
$('#nv').innerHTML=[['home','🏡','Home'],['workouts','💪','Workouts'],['nutrition','🥗','Nutrition'],['progress','📈','Progress'],['plan','🗓','My Plan']].map(t=>`<button data-t="${t[0]}" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join('');
const go=t=>{tab=t;render()};

function home(){
 const w=weekDone(mon(TODAY)),n=Object.keys(w).length,sg=suggest(),vac=isVac(TODAY);

 if(!S.seen)h+=`<div class="card"><h3>Your workout plan</h3><p>Five workouts you can split across the week however you like. Strength: A (glutes and lower body), C (upper body and core), E (glutes and full body). Cardio: B and D (walking, bike or elliptical).</p><p>Each workout has a short 5–10 minute version, the full 20–30 minute version, and an extra option. Any of them counts as done.</p><button class="btn alt" onclick="S.seen=1;save();render()">Dismiss</button></div>`;
 h+=`<div class="card" style="background:var(--lav2)"><p style="margin:0">${msg()}</p></div>`;
 if(vac)h+=`<div class="card"><h3>Vacation mode</h3><p>${VMSG}</p><small>Nothing is marked missed. A walk or short home workout is here if you want one.</small><button class="btn alt" onclick="launch('B')">Optional walk</button><button class="btn ghost" onclick="launch('E',1)">Short home workout</button></div>`;
 else if(sg)h+=`<div class="card"><small>Today's suggestion</small><h2 style="margin-top:4px">${W[sg].n}</h2><p class="mut">${W[sg].t} · or just 5–10 minutes</p><button class="btn" onclick="launch('${sg}')">Quick start</button><div class="row"><button class="btn alt" onclick="launch('${sg}',0,'min')">I'm low on motivation</button><button class="btn alt" onclick="tired()">I'm tired today</button></div></div>`;
 else h+=`<div class="card"><h3>All five workouts done this week</h3><p>Anything else is optional.</p></div>`;
 h+=`<div class="card"><h3>This week · ${n} of 5</h3><div class="dots">${Object.keys(W).map(k=>`<i class="${w[k]?'f':''}">${w[k]?'✓':''}</i>`).join('')}</div><small>Unfinished workouts don't carry over to next week.</small></div>`;
 h+=`<h3>Pick a workout</h3>`+Object.keys(W).map(k=>`<button class="btn ${w[k]?'alt':''}" onclick="launch('${k}')">${k} · ${W[k].n} ${w[k]?'✓':''}<br><small style="color:inherit;opacity:.8">${W[k].t}</small></button>`).join('');
 h+=SAFE;
 return h}
const tired=()=>sheet(`<h3>Low energy today</h3><p>Pick one:</p><button class="btn alt" onclick="closeSh();launch('B',0,'min')">A comfortable 5–10 minute walk</button><button class="btn alt" onclick="closeSh();launch('${suggest()||'A'}',0,'min')">Minimum version of today's workout</button><button class="btn ghost" onclick="closeSh()">Rest today</button>`);

function xcard(id,open){const x=EX[id];return`<details ${open?'open':''}><summary>${x.n}<br><small>${x.m} · ${x.s}</small>${x.pr?' <span class="tag l">when ready</span>':''}</summary>${fig(x.p)}
<p><b>Start with:</b> ${x.s}</p>${guide(id)}${DET[id].hs?`<div class="guide"><h3>Home version: ${x.h[0]}</h3><ol>${DET[id].hs.map(t=>`<li>${t}</li>`).join('')}</ol></div>`:''}<p><b>If it is too hard:</b> ${x.e[0]}. ${x.e[1]}</p><p class="mut">Persistent pain deserves a check with a clinician or physical therapist.</p>
${x.pr?`<div class="row">${['A','E'].map(s=>`<button class="btn alt" onclick="addEx('${s}','${id}')">${(S.add[s]||[]).includes(id)?'Remove from':'Add to'} ${s}</button>`).join('')}</div>`:''}</details>`}
function addEx(s,id){const a=S.add[s]=S.add[s]||[];const i=a.indexOf(id);i<0?a.push(id):a.splice(i,1);save();render()}
function workouts(){
 let h=`<h1>Workouts</h1>`+Object.keys(W).map(k=>`<div class="card"><h3>${k} · ${W[k].n}</h3><small>${W[k].t}</small><p>${W[k].c?'Walking, stationary bike, elliptical, or an outdoor walk at a comfortable, conversational pace.':exList(k).map(i=>EX[i].n).join(' · ')}</p><button class="btn" onclick="launch('${k}')">Start</button></div>`).join('');
 h+=`<h2>Exercise library</h2><small>Tap any card. Every exercise has a home option.</small>`+Object.keys(EX).filter(i=>!EX[i].pr).map(i=>xcard(i)).join('');
 h+=`<h2>When you feel ready</h2><small>Add these only when your current routine feels comfortable. Nothing unlocks by calendar alone.</small>`+Object.keys(EX).filter(i=>EX[i].pr).map(i=>xcard(i)).join('')+SAFE;
 return h}

/* ---------- launch + player ---------- */
function sheet(h){$('#sh').innerHTML=`<div>${h}</div>`;$('#sh').className='on'}
const closeSh=()=>$('#sh').className='';
let HOME=false;
function launch(slot,home,lvl){
 HOME=!!home;if(lvl){startW(slot,lvl);return}
 const c=W[slot].c,t=cardioTarget();
 sheet(`<h3>${W[slot].n}</h3><p class="mut">Choose a version. All three count as a completed workout.</p>
 <button class="btn alt" onclick="startW('${slot}','min')"><b>Minimum</b><br><small>${c?'A comfortable 5–10 minute walk':'5–10 minutes · 2 exercises · 1 set'}</small></button>
 <button class="btn" onclick="startW('${slot}','std')"><b>Standard</b><br><small style="color:#fff;opacity:.85">${c?`${t} minutes, easy pace`:'The planned 20–30 minute workout'}</small></button>
 <button class="btn alt" onclick="startW('${slot}','ext')"><b>Extra</b><br><small>Standard, plus an optional short walk</small></button>
 ${c?'':`<button class="chk ${HOME?'on':''}" onclick="HOME=!HOME;this.classList.toggle('on')"><b>${HOME?'✓':''}</b>I'm at home today (swap in home versions)</button>`}
 <button class="btn ghost" onclick="closeSh()">Not now</button>`)}
function startW(slot,lvl){
 closeSh();P={slot,lvl,i:0,home:HOME,min:lvl==='min'?7:cardioTarget(),eff:2};
 if(!W[slot].c)P.ex=exList(slot,lvl).map(id=>({id,easier:0,flag:0,ez:0,sets:Array.from({length:lvl==='min'?1:EX[id].s.startsWith('2')?2:2},()=>({r:'',w:'',ok:0}))}));
 pl()}
function pl(){
 const el=$('#pl');el.className='on';el.scrollTo(0,0);
 const top=`<div class="row" style="align-items:center"><button class="btn ghost" style="max-width:110px" onclick="quit()">Close</button><small style="text-align:right">${P.slot} · ${W[P.slot].n} · ${{min:'Minimum',std:'Standard',ext:'Extra'}[P.lvl]}</small></div>`;
 if(W[P.slot].c){el.innerHTML=top+`<h1>${W[P.slot].n}</h1><div class="card"><p><b>1.</b> Warm up with 3 easy minutes.<br><b>2.</b> Keep a pace where you could still talk.<br><b>3.</b> Slow down any time to recover. Build time before intensity.</p><p class="mut">Walking, stationary bike, elliptical, or outdoor walk. No machine is required.</p></div>
 <div class="card"><h3>How long did you go?</h3><div class="set"><input type="number" inputmode="numeric" value="${P.min}" oninput="P.min=+this.value"><span>minutes</span></div><h3>How did it feel?</h3><div class="rt" id="ef">${['Easy','Okay','Medium','Hard','Tough'].map((t,i)=>`<button class="${P.eff==i+1?'on':''}" onclick="P.eff=${i+1};pl()">${t[0]}${i+1}</button>`).join('')}</div><small>1 = very easy, 5 = very hard. Easy is great.</small>${P.lvl==='ext'?'<p class="mut">Extra: add a short, relaxed walk if you feel like it.</p>':''}</div>${SAFE}<button class="btn" onclick="finish()">Finish</button>`;return}
 const e=P.ex[P.i],x=EX[e.id],nm=e.easier?x.e[0]:(P.home?x.h[0]:x.n),last=lastLog(e.id);
 el.innerHTML=top+`<small>Exercise ${P.i+1} of ${P.ex.length}</small><div class="bar"><i style="width:${(P.i+1)/P.ex.length*100}%"></i></div>
 <h1 style="margin-top:12px">${esc(nm)}</h1>${fig(x.p)}<p class="mut">${x.m}<br>Start with <b>${x.s}</b>${P.home&&!e.easier?'':' · '+x.eq}</p>
 ${e.easier?`<div class="card" style="background:var(--lav2)">${x.e[1]}</div>`:P.home?`<div class="card" style="background:var(--lav2)">${x.h[1]}</div>`:''}
 ${last?`<small>Last time: ${last}</small>`:''}
 ${e.sets.map((s,i)=>`<div class="set"><small>Set ${i+1}</small><input type="number" inputmode="numeric" placeholder="reps" value="${s.r}" oninput="P.ex[${P.i}].sets[${i}].r=this.value"><input type="number" inputmode="decimal" placeholder="lb (optional)" value="${s.w}" oninput="P.ex[${P.i}].sets[${i}].w=this.value"><button class="ok ${s.ok?'on':''}" aria-label="Set done" onclick="P.ex[${P.i}].sets[${i}].ok^=1;this.classList.toggle('on')">✓</button></div>`).join('')}
 <button class="btn ghost" onclick="P.ex[${P.i}].sets.push({r:'',w:'',ok:0});pl()">+ Add a set</button>
 <button class="chk ${e.ez?'on':''}" onclick="P.ex[${P.i}].ez^=1;this.classList.toggle('on')"><b>${e.ez?'✓':''}</b>This felt easier than before</button>
 <div class="row"><button class="btn alt" onclick="P.ex[${P.i}].easier^=1;pl()">${e.easier?'Back to regular':'Make this easier'}</button><button class="btn alt" onclick="P.ex[${P.i}].flag=1;this.textContent='Flagged. Skip or go gently.'">This hurts</button></div>
 <details open><summary>Step-by-step instructions</summary>${e.easier&&x.e[2]?guide(x.e[2]):guide(e.id,P.home)}</details>
 <small class="mut">Rest as long as you need between sets.</small>${SAFE}
 <div class="row">${P.i>0?`<button class="btn ghost" onclick="P.i--;pl()">Back</button>`:''}<button class="btn" onclick="${P.i<P.ex.length-1?'P.i++;pl()':'finish()'}">${P.i<P.ex.length-1?'Next exercise':'Finish'}</button></div>
 <button class="btn ghost" onclick="${P.i<P.ex.length-1?'P.i++;pl()':'finish()'}">Skip this one</button>`}
function lastLog(id){for(let i=S.logs.length-1;i>=0;i--){const e=(S.logs[i].ex||[]).find(x=>x.id===id&&x.sets.some(s=>s.ok||s.r));if(e){const s=e.sets.find(s=>s.r)||{};return`${s.r||'?'} reps${s.w?' at '+s.w+' lb':''}`}}return''}
function quit(){P=null;$('#pl').className='';render()}
function finish(){
 const l={d:TODAY,slot:P.slot,lvl:P.lvl};
 if(W[P.slot].c){l.min=P.min;l.eff=P.eff}else l.ex=P.ex.map(e=>({id:e.id,easier:e.easier,ez:e.ez,flag:e.flag,sets:e.sets}));
 S.logs.push(l);(S.done[TODAY]=S.done[TODAY]||{})[P.slot]=P.lvl;save();P=null;$('#pl').className='';render();
 $('#ce').innerHTML=`<div class="cel" onclick="this.remove()"><div><b>✓</b><h2>Workout saved</h2><p class="mut">Added to your progress.</p><button class="btn">Continue</button></div></div>`}

 <div class="card"><h3>Today</h3>${items.map(i=>`<button class="chk ${n[i[0]]?'on':''}" onclick="nt('${i[0]}')"><b>${n[i[0]]?'✓':''}</b>${i[1]}</button>`).join('')}</div>

 ${S.prot.on?`<div class="row" style="align-items:center"><span>Your reference: <b>${S.prot.t} g</b></span><input type="number" value="${S.prot.t}" onchange="S.prot.t=+this.value||100;save();render()" style="max-width:90px"></div><p><span class="tag">Breakfast 20–25 g</span><span class="tag">Lunch 25–30 g</span><span class="tag">Snack 10–20 g</span><span class="tag">Dinner 25–30 g</span></p>`:'<small>Target hidden.</small>'}

/* ---------- progress ---------- */
function setW(k,v){const w=S.well[TODAY]=S.well[TODAY]||{};w[k]=w[k]===v?0:v;save();render()}
function setWb(k){const w=S.well[TODAY]=S.well[TODAY]||{};w[k]=!w[k];save();render()}
function progress(){
 const w=S.well[TODAY]||{},wk0=mon(TODAY),d=weekDone(wk0),all=S.logs;
 const cnt=(a,b)=>all.filter(l=>l.d>=a&&l.d<=b);
 const wl=cnt(wk0,add(wk0,6)),str=wl.filter(l=>!W[l.slot].c).length,car=wl.filter(l=>W[l.slot].c).length;
 const cm=wl.reduce((a,l)=>a+(l.min||0),0);
 const R=(t,k)=>`<p style="margin:12px 0 4px">${t}</p><div class="rt">${[1,2,3,4,5].map(i=>`<button class="${w[k]==i?'on':''}" onclick="setW('${k}',${i})">${i}</button>`).join('')}</div>`;
 let h=`<h1>Progress</h1><p class="mut">Strength, energy and consistency.</p>
 <div class="card"><h3>This week</h3><p>${Object.keys(d).length} of 5 opportunities · ${str} strength · ${car} cardio · ${cm} cardio minutes</p><small>No streaks. An incomplete week doesn't reset anything.</small></div>
 <div class="card"><h3>Today's check-in (optional)</h3><small>1 = low, 5 = great</small>${R('Sleep quality','sleep')}${R('Daytime energy','energy')}${R('Back comfort','back')}${R('Exercise confidence','conf')}${R('Mood','mood')}
 <button class="chk ${w.ease?'on':''}" onclick="setWb('ease')"><b>${w.ease?'✓':''}</b>Everyday activities felt easier</button>
 <div class="safe">Persistent back discomfort deserves an assessment by a clinician or physical therapist. Back pain has many possible causes.</div></div>`;
 const best={};all.forEach(l=>(l.ex||[]).forEach(e=>e.sets.forEach(s=>{const wt=+s.w||0,r=+s.r||0;if(r&&(!best[e.id]||wt>best[e.id].w||wt==best[e.id].w&&r>best[e.id].r))best[e.id]={w:wt,r}})));
 h+=`<div class="card"><h3>Strength log</h3>${Object.keys(best).length?Object.keys(best).map(i=>`<p style="margin:6px 0">${EX[i].n}: <b>${best[i].r} reps${best[i].w?' at '+best[i].w+' lb':''}</b></p>`).join(''):'<small>Your best lifts will show here after your first workout.</small>'}<small>Home workouts completed: ${all.filter(l=>l.home).length}</small></div>`;
 const eas=all.filter(l=>l.ex&&l.ex.some(e=>e.ez)).length;if(eas)h+=`<div class="card"><h3>${eas} workout${eas>1?'s':''} where something felt easier</h3></div>`;
 const rk=wk0,r=S.refl[rk]||{};
 h+=`<div class="card"><h3>Weekly reflection</h3>${[['e','What felt easier this week?'],['p','What am I proud of?'],['f','What exercise did I enjoy?'],['n','What would I like to improve next week?']].map(q=>`<p style="margin:10px 0 4px">${q[1]}</p><textarea onchange="(S.refl['${rk}']=S.refl['${rk}']||{}).${q[0]}=this.value;save()">${esc(r[q[0]]||'')}</textarea>`).join('')}</div>
 <div class="card"><h3>Body measurements</h3><small>Totally optional and private. Not part of your progress.</small><button class="btn ghost" onclick="S.meas=!S.meas;save();render()">${S.meas?'Hide this':'Show this'}</button>${S.meas?`<div class="row"><input id="mw" type="number" placeholder="weight (lb)"><button class="btn alt" onclick="S.m.push({d:TODAY,w:+$('#mw').value});save();render()">Save</button></div>${S.m.slice(-5).map(m=>`<small>${m.d}: ${m.w}</small><br>`).join('')}`:''}</div>`;
 return h}

function sch(d,v){if(!v)return;const a=S.sched[d]=S.sched[d]||[];if(!a.includes(v))a.push(v);save();render()}
function unsch(d,v){S.sched[d]=(S.sched[d]||[]).filter(x=>x!==v);save();render()}

 const w0=add(mon(TODAY),S.wo*7),dn=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
 let h=`<h1>My Plan</h1><div class="card"><h3>${PH[S.phase-1][0]}</h3><p>${PH[S.phase-1][1]}</p><small>Week ${wk()} of 12. You move up when you choose to, not automatically.</small>
 <div class="row">${S.phase>1?`<button class="btn ghost" onclick="S.phase--;save();render()">Go back a phase</button>`:''}${S.phase<3?`<button class="btn alt" onclick="S.phase++;save();render()">I'm ready for Phase ${S.phase+1}</button>`:''}</div></div>
 <div class="row" style="align-items:center"><button class="btn ghost" onclick="S.wo--;save();render()">‹</button><b style="text-align:center">${w0}</b><button class="btn ghost" onclick="S.wo++;save();render()">›</button></div>
